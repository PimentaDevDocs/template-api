spring.application.name=@project.name@
# Perfil padrão para execução local
spring.profiles.active=dev
# JWT / Webhook
jwt.secret=${JWT_SECRET}
webhook.secret=${WEBHOOK_SECRET:}
# 15 minutes
jwt.expiration-access=900000
# 7 days
jwt.expiration-refresh=604800000
# Rate limiting (login endpoint)
app.rate-limit.enabled=true
app.rate-limit.max-attempts=20
app.rate-limit.window=PT1M
app.rate-limit.cleanup-interval=PT5M
# JWT revocation (blacklist) cleanup interval
app.jwt.blacklist.cleanup-interval=PT5M
# Porta da aplicação
server.port=8080
# Boas práticas JPA
spring.jpa.open-in-view=false
# Optional RabbitMQ integration (disabled by default). Enable with app.rabbitmq.enabled=true
app.rabbitmq.enabled=false
# REQUIRED — No default value is intentional.
# Set via environment variable ADMIN_PASSWORD or in the active profile properties file (e.g. application-dev.properties).
# Every @SpringBootTest class that loads the full context must define this property
# via @TestPropertySource or @ActiveProfiles("test") which loads application-test.properties.
# Failure to provide this value will cause an IllegalStateException on startup.
app.admin.default-password=${ADMIN_PASSWORD}
app.rabbitmq.exchange=template-exchange
app.rabbitmq.queue.user-created=user-created
app.rabbitmq.routing-key.user-created=user.created
app.rabbitmq.queue.webhook=webhook-events
app.rabbitmq.routing-key.webhook=webhook.event
