# Configurações específicas do perfil de DESENVOLVIMENTO
# Banco de dados em memória H2
spring.datasource.url=jdbc:h2:mem:bolsao-db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
# Console H2 habilitado apenas em desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
# Admin test password (only for dev, min 10 chars with complexity)
app.admin.default-password=${ADMIN_PASSWORD}
# JPA/Hibernate - criar e dropar schema a cada reinício
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
# Logs detalhados em desenvolvimento
logging.level.root=INFO
logging.level.com.pimentadesenvolvimento.conroledebolsaoback=INFO
logging.level.com.pimentadesenvolvimento.conroledebolsaoback.config.DataLoader=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Swagger/OpenAPI aberto em desenvolvimento
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Flyway is disabled in dev to allow Hibernate to create/drop schema for fast feedback loops
spring.flyway.enabled=false
# Actuator (dev-only)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always