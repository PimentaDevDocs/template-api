# Configurações específicas do perfil de PRODUÇÃO
# Desabilita console H2 em produção
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false
# JPA/Hibernate - não alterar schema automaticamente em produção
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false
# Swagger/OpenAPI desabilitados por padrão em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Flyway migrations (ensure schema is created on startup)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# CORS - define a single allowed origin in production.
# You can set this via environment variable APP_ALLOWED_ORIGIN.
app.allowed-origin=https://example.com
# Actuator endpoints (healthy defaults for production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
# Logs mais enxutos em produção
logging.level.root=INFO
logging.level.com.pimentadesenvolvimento.conroledebolsaoback=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

