# =============================================================================
# TEST PROFILE — loaded by @ActiveProfiles("test") in integration tests
# All @SpringBootTest classes must use @ActiveProfiles("test") OR define
# app.admin.default-password via @TestPropertySource to avoid startup failure.
# Rate limiting is disabled here to prevent 429 errors during setUp() logins.
# Flyway is disabled here because Hibernate DDL (create-drop) handles schema.
# =============================================================================
spring.application.name=Template API
# Test configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Flyway - DISABLED for testing (migrations are handled by Hibernate DDL for tests)
spring.flyway.enabled=false
# JWT and Security
jwt.secret=01234567890123456789012345678901
jwt.expiration-access=400000
jwt.expiration-refresh=86400000
webhook.secret=testsecret
# Admin default password for tests
app.admin.default-password=TestAdmin123!@
# Rate limiting - DISABLED for tests (multiple logins in setUp cause 429)
app.rate-limit.enabled=false
app.rate-limit.max-attempts=20
app.rate-limit.window=PT1M
app.rate-limit.cleanup-interval=PT5M
# JWT Blacklist cleanup
app.jwt.blacklist.cleanup-interval=300000
